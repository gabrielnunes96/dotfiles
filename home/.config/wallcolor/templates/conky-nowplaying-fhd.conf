conky.config = {
  xinerama_head = 1,
  alignment = 'bottom_left', gap_x = 60, gap_y = 90,
  own_window = true, own_window_type = 'desktop', own_window_class = 'Conky',
  own_window_transparent = true, own_window_argb_visual = true,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  double_buffer = true, update_interval = 0.05,
  use_xft = true, font = 'JetBrainsMono NF:size=12',
  default_color = 'f2f2f2', color1 = '{{accent}}',
  draw_shades = true, default_shade_color = '00000088', shade_x = 2, shade_y = 2,
  minimum_width = 520, maximum_width = 520,
};
conky.text = [[
${if_match "${execi 1 playerctl status 2>/dev/null}" != ""}\
${color1}${font JetBrainsMono NF:bold:size=10}NOW PLAYING${font}${color}  ${execi 1 playerctl status 2>/dev/null | tr a-z A-Z}
${font JetBrainsMono NF:bold:size=22}${execi 1 playerctl metadata --format '{{trunc(title,28)}}' 2>/dev/null}${font}
${font JetBrainsMono NF:size=14}${execi 1 playerctl metadata --format '{{trunc(artist,36)}}' 2>/dev/null}${font}
${voffset 4}${font JetBrainsMono NF:size=16}${color1}${cat /run/user/1000/cava.txt}${color}${font}\
${endif}
]];
