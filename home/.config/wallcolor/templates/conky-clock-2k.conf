conky.config = {
  xinerama_head = 0,
  alignment = 'top_middle', gap_y = 110,
  own_window = true, own_window_type = 'desktop', own_window_class = 'Conky',
  own_window_transparent = true, own_window_argb_visual = true,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  double_buffer = true, update_interval = 1,
  use_xft = true, font = 'JetBrainsMono NF:size=18',
  default_color = 'f2f2f2', color1 = '{{accent}}',
  draw_shades = true, default_shade_color = '00000088', shade_x = 2, shade_y = 2,
  draw_outline = false, draw_borders = false,
  minimum_width = 900, maximum_width = 900,
};
conky.text = [[
${alignc}${font JetBrainsMono NF:bold:size=64}${execi 60 date +%A | tr a-z A-Z | sed 's/./& /g;s/ $//'}${font}
${voffset 6}${alignc}${execi 60 date '+%B %d, %Y' | tr a-z A-Z | sed 's/./& /g;s/ $//'}
${alignc}- ${time %H:%M} -
]];
